<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Peserta - SMA 11</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
</head>
<body>
  <div class="container">
    <h1>Ujian Online SMA 11</h1>

    <div id="formLogin">
      <input type="text" id="nama" placeholder="Nama Lengkap" required>
      <input type="text" id="token" placeholder="Token Ujian" required>
      <select id="mapel">
        <option value="Biologi">Biologi</option>
        <option value="Matematika">Matematika</option>
        <option value="Fisika">Fisika</option>
        <option value="Kimia">Kimia</option>
        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
        <option value="Bahasa Inggris">Bahasa Inggris</option>
      </select>
      <button onclick="mulaiUjian()">Mulai Ujian</button>
    </div>

    <div id="areaUjian" style="display:none;">
      <div class="info">
        <span id="infoNama"></span> | <span id="infoMapel"></span> | <span id="timer">60:00</span>
      </div>
      <video id="kamera" autoplay playsinline muted style="width:100%; max-width:400px; border-radius:8px; margin:10px 0;"></video>
      <div id="soalContainer"></div>
      <button onclick="selesaiUjian()">Selesai Ujian</button>
    </div>

    <div id="hasil" style="display:none;">
      <h2>Hasil Ujian</h2>
      <p id="nilaiAkhir"></p>
      <p id="pesanHasil"></p>
    </div>
  </div>

  <script src="js/data-soal.js"></script>
  <script src="js/ujian.js"></script>
</body>
</html>
